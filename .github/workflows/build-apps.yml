
name: Build Main App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - both
          - android
          - ios
        default: both
        required: true


concurrency:
  group: build-main-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    name: Android - Main App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Patch react-native-callkeep
        run: node node_modules/@caro/react-native-calling/scripts/fix-callkeep.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs=-Xmx4g

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/release \
            -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/out"
          NAME="main-app-${GITHUB_SHA::7}.apk"
          cp "$APK" "$GITHUB_WORKSPACE/out/$NAME"
          echo "path=$GITHUB_WORKSPACE/out/$NAME" >> "$GITHUB_OUTPUT"

      - name: Sign APK with release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KS_B64" ]; then
            echo "Release keystore not configured; keeping Gradle-built APK."
            exit 0
          fi

          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n1)

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            "${{ steps.apk.outputs.path }}"

          "$APKSIGNER" verify "${{ steps.apk.outputs.path }}"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-main-app
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    name: iOS - Main App
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Patch react-native-callkeep
        run: node node_modules/@caro/react-native-calling/scripts/fix-callkeep.js

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Find workspace and scheme
        id: xc
        shell: bash
        run: |
          set -euo pipefail

          WS=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)

          if [ -z "$WS" ]; then
            echo "No Xcode workspace found under ios/"
            exit 1
          fi

          SCHEME=$(basename "$WS" .xcworkspace)

          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          mkdir -p "$GITHUB_WORKSPACE/out"

      - name: Check iOS signing configuration
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS Simulator app
        if: steps.sign.outputs.signed == 'false'
        shell: bash
        run: |
          set -euo pipefail

          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -n 50

          APP=$(find build/Build/Products/Release-iphonesimulator \
            -maxdepth 1 -name '*.app' -print -quit)

          if [ -z "$APP" ]; then
            echo "Simulator app not found"
            exit 1
          fi

          (cd "$(dirname "$APP")" && \
            zip -qry "$GITHUB_WORKSPACE/out/main-app-ios-simulator.zip" \
            "$(basename "$APP")")

      - name: Install Apple signing certificate and profile
        if: steps.sign.outputs.signed == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS=$(openssl rand -hex 16)

          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"

          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"

          security import "$RUNNER_TEMP/cert.p12" \
            -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"

          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KCPASS" "$KC"

          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROFILE" | base64 -d \
            > "$RUNNER_TEMP/app.mobileprovision"

          UUID=$(security cms -D \
            -i "$RUNNER_TEMP/app.mobileprovision" \
            | plutil -extract UUID raw -)

          cp "$RUNNER_TEMP/app.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export IPA
        if: steps.sign.outputs.signed == 'true'
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          PLIST=$(security cms -D -i "$PROFILE_PATH")

          if [ "$(echo "$PLIST" | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null || true)" = "true" ]; then
            METHOD=debugging
            IDENTITY="Apple Development"
          elif echo "$PLIST" | plutil -extract ProvisionedDevices raw - >/dev/null 2>&1; then
            METHOD=release-testing
            IDENTITY="Apple Distribution"
          else
            METHOD=app-store-connect
            IDENTITY="Apple Distribution"
          fi

          BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")

          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/app.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="$IDENTITY" | tail -n 50

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>teamID</key>
            <string>${TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/app.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist | tail -n 30

          IPA=$(find build/ipa -maxdepth 1 -name '*.ipa' -print -quit)

          if [ -z "$IPA" ]; then
            echo "Exported IPA not found"
            exit 1
          fi

          cp "$IPA" "$GITHUB_WORKSPACE/out/main-app-${GITHUB_SHA::7}.ipa"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-main-app
          path: out/*
          if-no-files-found: error
          retention-days: 14
