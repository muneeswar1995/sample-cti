
ios:
  needs: plan
  if: needs.plan.outputs.ios == 'true'
  name: ios (main-app)
  runs-on: macos-15
  timeout-minutes: 90

  defaults:
    run:
      working-directory: .    

  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install --no-audit --no-fund
        fi

    - name: Patch react-native-callkeep for the New Architecture
      run: node node_modules/@caro/react-native-calling/scripts/fix-callkeep.js

    - name: Generate native iOS project
      run: npx expo prebuild --platform ios

    - name: Find workspace and scheme
      id: xc
      run: |
        ws=$(ls -d ios/*.xcworkspace | head -n1)
        scheme=$(basename "$ws" .xcworkspace)
        echo "workspace=$ws" >> "$GITHUB_OUTPUT"
        echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
        mkdir -p "$GITHUB_WORKSPACE/out"

    - name: Check for signing secrets
      id: sign
      env:
        P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
        PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        TEAM: ${{ secrets.IOS_TEAM_ID }}
      run: |
        if [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
          echo "signed=true" >> "$GITHUB_OUTPUT"
        else
          echo "signed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build for iOS Simulator
      if: steps.sign.outputs.signed == 'false'
      run: |
        set -o pipefail
        xcodebuild \
          -workspace "${{ steps.xc.outputs.workspace }}" \
          -scheme "${{ steps.xc.outputs.scheme }}" \
          -configuration Release \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO | tail -n 50

        app=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n1)
        (cd "$(dirname "$app")" && \
          zip -qry "$GITHUB_WORKSPACE/out/cti-main-app-simulator.zip" "$(basename "$app")")

    - name: Install signing certificate and profile
      if: steps.sign.outputs.signed == 'true'
      env:
        P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
        P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
        PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
      run: |
        kc="$RUNNER_TEMP/build.keychain-db"
        kcpass=$(openssl rand -hex 16)

        security create-keychain -p "$kcpass" "$kc"
        security set-keychain-settings -lut 21600 "$kc"
        security unlock-keychain -p "$kcpass" "$kc"

        echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" \
          -P "$P12_PASS" -A -t cert -f pkcs12 -k "$kc"

        security set-key-partition-list \
          -S apple-tool:,apple: -k "$kcpass" "$kc"

        security list-keychains -d user -s "$kc" \
          $(security list-keychains -d user | tr -d '"')

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"

        uuid=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" \
          | plutil -extract UUID raw -)

        cp "$RUNNER_TEMP/app.mobileprovision" \
          ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision

        echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
        rm -f "$RUNNER_TEMP/cert.p12"

    - name: Archive and export IPA
      if: steps.sign.outputs.signed == 'true'
      env:
        TEAM: ${{ secrets.IOS_TEAM_ID }}
      run: |
        set -o pipefail

        profile_path=~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
        plist=$(security cms -D -i "$profile_path")

        if [ "$(echo "$plist" | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null)" = "true" ]; then
          method=debugging
          identity="Apple Development"
        elif echo "$plist" | plutil -extract ProvisionedDevices raw - >/dev/null 2>&1; then
          method=release-testing
          identity="Apple Distribution"
        else
          method=app-store-connect
          identity="Apple Distribution"
        fi

        echo "Export method: $method"

        bundle_id=$(node -p "require('./app.json').expo.ios.bundleIdentifier")

        xcodebuild \
          -workspace "${{ steps.xc.outputs.workspace }}" \
          -scheme "${{ steps.xc.outputs.scheme }}" \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/app.xcarchive \
          archive \
          DEVELOPMENT_TEAM="$TEAM" \
          CODE_SIGN_STYLE=Manual \
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
          CODE_SIGN_IDENTITY="$identity" | tail -n 50

        cat > build/ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>method</key><string>${method}</string>
          <key>teamID</key><string>${TEAM}</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
            <key>${bundle_id}</key><string>${PROFILE_UUID}</string>
          </dict>
        </dict></plist>
        EOF

        xcodebuild \
          -exportArchive \
          -archivePath build/app.xcarchive \
          -exportPath build/ipa \
          -exportOptionsPlist build/ExportOptions.plist | tail -n 20

        cp build/ipa/*.ipa "$GITHUB_WORKSPACE/out/cti-main-app-${GITHUB_SHA::7}.ipa"

    - uses: actions/upload-artifact@v4
      with:
        name: ios-main-app
        path: out/*
        retention-days: 14
